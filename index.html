async function accountsView(){const A=await rpc('trial_balance',{});return `<h2>الحسابات</h2><div class="card np"><button onclick="act(async()=>{const n=await rpc('rebuild_journal',{});alert('تم تحديث القيود: '+n+' مستند')})">ترحيل القيود</button><button class="s" onclick="journalForm()">قيد يومية يدوي</button></div><div class="card"><b>ميزان المراجعة</b>${T(['الكود','الحساب','النوع','مدين','دائن','الرصيد'],A.map(a=>[a.code,e(a.name),a.type,fmt(a.debit),fmt(a.credit),fmt(a.balance)]))}</div>`}
function journalForm(){const opts=C.accounts||[];let A=opts.length?opts:[];if(!A.length){alert('الحسابات يتم تحميلها داخل شاشة الحسابات.');return}$('#app').insertAdjacentHTML('beforeend',`<div id="jm" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:15px"><div class="card" style="width:min(760px,100%)"><h3>قيد يومية يدوي</h3><input id="jd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="jx" placeholder="البيان" style="width:55%"><div id="jl"></div><button class="s" onclick="addJournalRow()">+ سطر</button><button onclick="saveJournal()">حفظ القيد</button><button class="danger" onclick="$('#jm').remove()">إغلاق</button></div></div>`);for(let i=0;i<2;i++)addJournalRow()}
function addJournalRow(){const el=$('#jl');if(!el)return;const A=C.accounts||[];const opts=A.map(a=>`<option value="${a.code}">${a.code} - ${e(a.name)}</option>`).join('');el.insertAdjacentHTML('beforeend',`<div class="row jrow"><select class="jacc">${opts}</select><input class="jdv" type="number" placeholder="مدين"><input class="jcv" type="number" placeholder="دائن"></div>`) }
async function saveJournal(){const rows=[...document.querySelectorAll('.jrow')].map(r=>({account_code:r.querySelector('.jacc').value,debit:+r.querySelector('.jdv').value||0,credit:+r.querySelector('.jcv').value||0})).filter(x=>x.debit||x.credit);await act(async()=>{await rpc('create_manual_journal',{p_date:v('jd'),p_description:v('jx'),p_lines:rows});$('#jm').remove()})}
async function ensureAccounts(){if(!C.accounts)C.accounts=await g('accounts','code')}
async function employeesView(){const L=await g('employees','name');return `<h2>الموظفون</h2><div class="card np"><div class="row"><input id="en" placeholder="الاسم"><input id="ej" placeholder="الوظيفة"><input id="eh" placeholder="الهاتف"><input id="es" type="number" placeholder="المرتب"><input id="ed2" type="date"><button onclick="act(()=>ins('employees',{name:v('en'),job:v('ej'),phone:v('eh'),salary:n('es'),joining_date:v('ed2')||null}))">إضافة</button></div></div><div class="card">${T(['الاسم','الوظيفة','الهاتف','المرتب','الحالة'],L.map(x=>[e(x.name),e(x.job),e(x.phone),fmt(x.salary),x.active?'نشط':'موقوف']))}</div>`}
async function payrollView(){const E=await g('employees','name'),L=await g('payroll','month');return `<h2>المرتبات</h2><div class="card np"><select id="pe">${O(E)}</select><input id="pmo" type="month"><input id="pb2" type="number" placeholder="الأساسي"><input id="po" type="number" placeholder="إضافي"><input id="pbn" type="number" placeholder="مكافأة"><input id="pa" type="number" placeholder="سلف"><input id="pd" type="number" placeholder="خصومات"><input id="pab" type="number" placeholder="غياب"><select id="pac">${O(C.accts)}</select><button onclick="act(async()=>{if(!v('pmo'))throw Error('اختر الشهر');await ins('payroll',{employee_id:v('pe'),month:v('pmo')+'-01',basic:n('pb2')||+(by(E,v('pe')).salary),overtime:n('po'),bonus:n('pbn'),advances:n('pa'),deductions:n('pd'),absence_deductions:n('pab')})})">إنشاء كشف</button></div><div class="card">${T(['الموظف','الشهر','الأساسي','الصافي','الحالة',''],L.reverse().map(x=>[e(by(E,x.employee_id).name),x.month.slice(0,7),fmt(x.basic),fmt(x.net),x.paid?'مدفوع':'غير مدفوع',x.paid?'':`<button onclick="act(()=>rpc('pay_payroll',{p_payroll:'${x.id}',p_account:v('pac')}))">دفع</button>`]))}</div>`}
async function retView(){const SI=await g('sales_invoices','date'),PI=await g('purchase_invoices','date'),sel=window._rk!=='p',L=sel?SI:PI;return `<h2>المرتجعات</h2><div class="card np"><select id="rk" onchange="window._rk=v('rk');RT=null;R()"><option value="s" ${sel?'selected':''}>مرتجع مبيعات</option><option value="p" ${sel?'':'selected'}>مرتجع مشتريات</option></select><select id="ri">${L.map(x=>`<option value="${x.id}">${e(x.number)} — ${fmt(x.total)}</option>`).join('')}</select><button class="s" onclick="loadRet()">عرض البنود</button>${RT?T(['المنتج','الكمية','كمية المرتجع'],RT.items.map((x,i)=>[e(by(C.products,x.product_id).name),x.qty,`<input id="rq${i}" type="number" step="0.001" value="0" style="width:90px">`]))+`<button onclick="act(async()=>{const items=${JSON.stringify(RT.items).replace(/</g,'\\u003c')}.map((x,i)=>({product_id:x.product_id,qty:n('rq'+i)})).filter(x=>x.qty>0);await rpc('${RT.s?'create_sales_return':'create_purchase_return'}',{p_invoice:'${RT.id}',p_items:items});RT=null})">حفظ المرتجع</button>`:''}</div>`}
async function loadRet(){const s=v('rk')==='s',id=v('ri');const{data,error}=await sb.from(s?'sales_invoice_items':'purchase_invoice_items').select('product_id,qty').eq('invoice_id',id);if(error)throw error;RT={s,id,items:data||[]};R()}
async function stmtView(){const cu=window._sk!=='s';return `<h2>كشف الحساب</h2><div class="card np"><select id="sk" onchange="window._sk=v('sk');st='';R()"><option value="c" ${cu?'selected':''}>عميل</option><option value="s" ${cu?'':'selected'}>مورد</option></select><select id="sp">${O(cu?C.customers:C.suppliers)}</select> من <input type="date" id="sa"> إلى <input type="date" id="sb2"><button onclick="showStmt()">عرض</button><button class="s" onclick="window.print()">طباعة / PDF</button></div><div class="card">${st||'اختر الطرف والفترة ثم اضغط عرض'}</div>`}
async function showStmt(){const cu=v('sk')==='c',id=v('sp'),a=v('sa')||'0000-01-01',b=v('sb2')||'9999-12-31',P_=by(cu?C.customers:C.suppliers),rows=await rpc(cu?'customer_statement':'supplier_statement',{p_party:id,p_to:b}),sg=cu?1:-1;let bal=+P_.opening_balance;const body=rows.filter(r=>r.d>=a).sort((x,y)=>x.d.localeCompare(y.d)).map(r=>{bal+=sg*(r.debit-r.credit);return[r.d,e(r.doc),e(r.descr),fmt(r.debit),fmt(r.credit),fmt(bal)]});st=`<h3>${e(P_.name)}</h3><p>رصيد افتتاحي: <b>${fmt(P_.opening_balance)}</b></p>`+T(['التاريخ','المستند','البيان','مدين','دائن','الرصيد'],body)+`<p>الرصيد الختامي: <b>${fmt(bal)}</b></p>`;R()}
async function quotationsView(){const L=await g('quotations','date'),tot=cart.q.reduce((a,l)=>a+l.qty*l.price-l.discount,0);return `<h2>عروض الأسعار</h2><div class="card np"><div class="row"><select id="ip">${O(C.customers)}</select><select id="il">${O(C.products.filter(p=>p.active))}</select><input id="iq" type="number" value="1" style="width:80px"><input id="ir" type="number" placeholder="السعر"><input id="id" type="number" placeholder="خصم"><button class="s" onclick="addLine('q')">+ بند</button></div>${cartTable('q')}<p>الإجمالي: <b>${fmt(tot)}</b></p><input id="vu" type="date"><button onclick="act(async()=>{await rpc('create_quotation',{p_customer:v('ip'),p_valid:v('vu')||null,p_items:cart.q});cart.q=[]})">حفظ العرض</button></div><div class="card">${T(['رقم','التاريخ','العميل','صالح حتى','الحالة',''],L.reverse().map(x=>[x.number,x.date,e(by(C.customers,x.customer_id).name),x.valid_until||'',x.status,x.status==='Open'?`<button onclick="act(()=>rpc('quotation_to_order',{p_quo:'${x.id}',p_warehouse:'${(C.warehouses[0]||{}).id}'}))">تحويل لأمر بيع</button>`:'']))}</div>`}
async function ordersView(){const L=await g('sales_orders','date');return `<h2>أوامر البيع</h2><div class="card np"><select id="oa">${O(C.accts)}</select><input id="op" type="number" placeholder="المدفوع عند التحويل"></div><div class="card">${T(['رقم','التاريخ','العميل','الحالة',''],L.reverse().map(x=>[x.number,x.date,e(by(C.customers,x.customer_id).name),x.status,x.status==='Confirmed'?`<button onclick="act(()=>rpc('order_to_invoice',{p_order:'${x.id}',p_paid:n('op'),p_account:n('op')>0?v('oa'):null,p_method:n('op')>0?'cash':'credit'}))">تحويل لفاتورة</button> <button class="s" onclick="act(()=>rpc('cancel_order',{p_order:'${x.id}'}))">إلغاء</button>`:'']))}</div>`}
async function usersView(){const L=await g('profiles','created_at');return `<h2>المستخدمون</h2><div class="card">${T(['الاسم','البريد','الدور','مفعّل'],L.map(u=>[e(u.name),e(u.username),`<select onchange="act(()=>upd('profiles','${u.id}',{role:this.value}))">${['admin','accountant','sales','store'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select>`,`<input type="checkbox" ${u.active?'checked':''} ${u.id===me.id?'disabled':''} onchange="act(()=>upd('profiles','${u.id}',{active:this.checked}))">`]))}</div>`}
async function auditView(){const L=await g('audit_logs','created_at');return `<h2>سجل العمليات</h2><div class="card">${T(['الوقت','المستخدم','العملية','القسم','الوصف'],L.slice(0,300).map(a=>[new Date(a.created_at).toLocaleString('ar-EG'),e(a.user_name),a.action,a.entity,e(a.description)]))}</div>`}
async function settingsView(){const{data:s,error}=await sb.from('company_settings').select('*').single();if(error)throw error;return `<h2>الإعدادات</h2><div class="card np"><div class="row"><input id="sc" value="${e(s.company_name)}"><input id="sp" value="${e(s.invoice_prefix)}"><input id="stn" value="${e(s.tax_number)}" placeholder="الرقم الضريبي"><label><input type="checkbox" id="sn" ${s.negative_stock?'checked':''}> السماح بالمخزون السالب</label><label><input type="checkbox" id="ste" ${s.tax_enabled?'checked':''}> تفعيل الضريبة</label><input id="sx" type="number" value="${s.tax_pct}" style="width:80px"><button onclick="act(()=>upd('company_settings',1,{company_name:v('sc'),invoice_prefix:v('sp'),tax_number:v('stn'),negative_stock:$('#sn').checked,tax_enabled:$('#ste').checked,tax_pct:n('sx')}))">حفظ</button></div></div>`}
async function runSmokeTest(){const box=$('#smokeResult');if(box)box.innerHTML='<p>جاري الاختبار...</p>';try{const r=await rpc('run_erp_smoke_test',{});const rows=(r.results||[]).map(x=>{const p=x.pass?'✓':'✗';const vals=Object.entries(x).filter(([k])=>!['test','pass'].includes(k)).map(([k,v])=>`${e(k)}=${e(v)}`).join(' | ');return`<div class="${x.pass?'good':'bad'}">${p} ${e(x.test)}${vals?' — '+vals:''}</div>`}).join('');if(box)box.innerHTML=`<div class="card"><b class="${r.ok?'good':'bad'}">${r.ok?'نجح اختبار النظام بالكامل':'فشل اختبار النظام'}</b>${rows}<p>تم تنظيف بيانات الاختبار: ${r.cleaned?'نعم':'لا'}</p></div>`}catch(x){if(box)box.innerHTML=`<div class="card bad">فشل تشغيل الاختبار: ${e(x.message||x)}</div>`}}
async function R(q){
  if(!me){$('#app').innerHTML=`<main><div class="card" style="max-width:360px;margin:60px auto"><h2>تسجيل الدخول</h2><input id="lu" type="email" placeholder="البريد" style="width:95%"><input id="lp" type="password" placeholder="كلمة المرور" style="width:95%"><button onclick="login()" style="width:95%">دخول</button><button class="s" onclick="signup()" style="width:95%">إنشاء حساب (الأول = مدير)</button></div></main>`;return}
  if(!me.active){$('#app').innerHTML=`<main><div class="card"><h2>حسابك بانتظار التفعيل من المدير</h2><button onclick="logout()">خروج</button></div></main>`;return}
  if(!can(view))view='dash';await loadAll();if(view==='jr')await ensureAccounts();
  let h='';
  if(view==='dash')h=await dash();
  else if(view==='prod')h=productsView(); else if(view==='cust')h=masterForm('cust'); else if(view==='supp')h=masterForm('supp');
  else if(view==='sales')h=(await invoiceView(true)).replace('onclick="act(async()=>{const paid=n(\'ipd\'),account=v(\'ia\');await rpc(\'create_sale\',s?{s}:{s})})"','onclick="act(()=>saveInvoice(true))"');
  else if(view==='purch')h=(await invoiceView(false)).replace('onclick="act(async()=>{const paid=n(\'ipd\'),account=v(\'ia\');await rpc(\'create_purchase\',s?{s}:{s})})"','onclick="act(()=>saveInvoice(false))"');
  else if(view==='pay')h=await payView(); else if(view==='trf')h=await transferView(); else if(view==='stk')h=await stocktakeView();
  else if(view==='ret')h=await retView(); else if(view==='quo')h=await quotationsView(); else if(view==='ord')h=await ordersView(); else if(view==='stmt')h=await stmtView();
  else if(view==='exp'){const L=await g('expenses','date');h=`<h2>المصروفات</h2><div class="card np"><select id="ec"><option>إيجار</option><option>كهرباء</option><option>مياه</option><option>إنترنت</option><option>رواتب</option><option>نقل</option><option>صيانة</option><option>تسويق</option><option>أخرى</option></select><input id="ed" placeholder="الوصف"><input id="ea" type="number" placeholder="المبلغ"><select id="ex">${O(C.accts)}</select><button onclick="act(()=>rpc('create_expense',{p_category:v('ec'),p_desc:v('ed'),p_amount:n('ea'),p_account:v('ex')}))">حفظ</button></div><div class="card">${T(['التاريخ','التصنيف','الوصف','المبلغ'],L.reverse().map(x=>[x.date,x.category,e(x.description),fmt(x.amount)]))}</div>`}
  else if(view==='cash')h=`<h2>الخزينة</h2><div class="card np"><input id="an" placeholder="اسم حساب"><input id="ao" type="number" placeholder="رصيد افتتاحي"><button onclick="act(()=>ins('cash_accounts',{name:v('an'),opening_balance:n('ao'),balance:n('ao')}))">إضافة</button></div><div class="card"><b>الحسابات</b>${T(['الحساب','الرصيد'],C.accts.map(a=>[e(a.name),fmt(a.balance)]))}</div>`;
  else if(view==='emp')h=await employeesView(); else if(view==='prl')h=await payrollView(); else if(view==='rep')h=await reportsView(); else if(view==='jr')h=await accountsView();
  else if(view==='users')h=await usersView(); else if(view==='audit')h=await auditView(); else if(view==='set')h=await settingsView();
  $('#app').innerHTML=`<nav class="np"><b class="brand" style="display:block;padding:8px 8px 14px">${e(me.name)}<div class="muted" style="font-size:11px">${e(me.role)}</div></b>${NAV.filter(x=>can(x[0])).map(x=>`<a class="${view===x[0]?'on':''}" onclick="view='${x[0]}';R()">${x[1]}</a>`).join('')}<a onclick="logout()">خروج</a></nav><main>${h}</main>`;
  if(q){const i=$('#q');if(i){i.focus();i.setSelectionRange(99,99)}}
}
async function login(){const{error}=await sb.auth.signInWithPassword({email:v('lu'),password:v('lp')});if(error)return alert(error.message);await boot()}
async function signup(){const{error}=await sb.auth.signUp({email:v('lu'),password:v('lp')});if(error)return alert(error.message);alert('تم إنشاء الحساب. أكد البريد إذا كان التأكيد مفعلاً.')}
async function logout(){await sb.auth.signOut();me=null;R()}
async function boot(){const{data:{user}}=await sb.auth.getUser();me=null;if(user){const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(!error)me=data}R()}
sb.auth.getSession().then(boot);
</script>
</body></html>
