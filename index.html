async function R(q){
  if(!me){$('#app').innerHTML=`<main><div class="card" style="max-width:360px;margin:60px auto"><h2>تسجيل الدخول</h2><input id="lu" type="email" placeholder="البريد" style="width:95%"><input id="lp" type="password" placeholder="كلمة المرور" style="width:95%"><button onclick="login()" style="width:95%">دخول</button><button class="s" onclick="signup()" style="width:95%">إنشاء حساب (الأول = مدير)</button></div></main>`;return}
  if(!me.active){$('#app').innerHTML=`<main><div class="card"><h2>حسابك بانتظار التفعيل من المدير</h2><button onclick="logout()">خروج</button></div></main>`;return}
  if(!can(view))view='dash';await loadAll();if(view==='jr')await ensureAccounts();
  let h='';
  if(view==='dash')h=await dash();
  else if(view==='prod')h=productsView(); else if(view==='cust')h=masterForm('cust'); else if(view==='supp')h=masterForm('supp');
  else if(view==='sales')h=(await invoiceView(true)).replace('onclick="act(async()=>{const paid=n(\'ipd\'),account=v(\'ia\');await rpc(\'create_sale\',s?{s}:{s})})"','onclick="act(()=>saveInvoice(true))"');
  else if(view==='purch')h=(await invoiceView(false)).replace('onclick="act(async()=>{const paid=n(\'ipd\'),account=v(\'ia\');await rpc(\'create_purchase\',s?{s}:{s})})"','onclick="act(()=>saveInvoice(false))"');
  else if(view==='pay')h=await payView(); else if(view==='trf')h=await transferView(); else if(view==='stk')h=await stocktakeView();
  else if(view==='ret')h=await retView(); else if(view==='quo')h=await quotationsView(); else if(view==='ord')h=await ordersView(); else if(view==='stmt')h=await stmtView();
  else if(view==='exp'){const L=await g('expenses','date');h=`<h2>المصروفات</h2><div class="card np"><select id="ec"><option>إيجار</option><option>كهرباء</option><option>مياه</option><option>إنترنت</option><option>رواتب</option><option>نقل</option><option>صيانة</option><option>تسويق</option><option>أخرى</option></select><input id="ed" placeholder="الوصف"><input id="ea" type="number" placeholder="المبلغ"><select id="ex">${O(C.accts)}</select><button onclick="act(()=>rpc('create_expense',{p_category:v('ec'),p_desc:v('ed'),p_amount:n('ea'),p_account:v('ex')}))">حفظ</button></div><div class="card">${T(['التاريخ','التصنيف','الوصف','المبلغ'],L.reverse().map(x=>[x.date,x.category,e(x.description),fmt(x.amount)]))}</div>`}
  else if(view==='cash')h=`<h2>الخزينة</h2><div class="card np"><input id="an" placeholder="اسم حساب"><input id="ao" type="number" placeholder="رصيد افتتاحي"><button onclick="act(()=>ins('cash_accounts',{name:v('an'),opening_balance:n('ao'),balance:n('ao')}))">إضافة</button></div><div class="card"><b>الحسابات</b>${T(['الحساب','الرصيد'],C.accts.map(a=>[e(a.name),fmt(a.balance)]))}</div>`;
  else if(view==='emp')h=await employeesView(); else if(view==='prl')h=await payrollView(); else if(view==='rep')h=await reportsView(); else if(view==='jr')h=await accountsView();
  else if(view==='users')h=await usersView(); else if(view==='audit')h=await auditView(); else if(view==='set')h=await settingsView();
  $('#app').innerHTML=`<nav class="np"><b class="brand" style="display:block;padding:8px 8px 14px">${e(me.name)}<div class="muted" style="font-size:11px">${e(me.role)}</div></b>${NAV.filter(x=>can(x[0])).map(x=>`<a class="${view===x[0]?'on':''}" onclick="view='${x[0]}';R()">${x[1]}</a>`).join('')}<a onclick="logout()">خروج</a></nav><main>${h}</main>`;
  if(q){const i=$('#q');if(i){i.focus();i.setSelectionRange(99,99)}}

  if(view==='cash')return `${sectionHead('الخزينة','الحسابات النقدية والتحويلات الداخلية.')}<div class=\"card form-card\"><div class=\"row\"><input id=\"an\" placeholder=\"اسم حساب\"><select id=\"at\"><option value=\"cash\">خزينة</option><option value=\"bank\">بنك</option><option value=\"wallet\">محفظة</option><option value=\"other\">أخرى</option></select><input id=\"ao\" type=\"number\" placeholder=\"رصيد افتتاحي\"><button class=\"btn\" onclick=\"act(()=>ins('cash_accounts',{name:v('an'),type:v('at'),opening_balance:n('ao'),balance:n('ao')}))\">إضافة</button></div></div><div class=\"card\">${T(['الحساب','النوع','الرصيد'],C.accts.map(a=>[e(a.name),a.type,money(a.balance)]))}</div>`;

async function R(q){
  if(!me){return _loginScreen()}
  if(!me.active){return _inactiveScreen()}
  if(!can(view))view='dash';
  await loadAll();
  let h='';
  try{
    if(view==='dash')h=await dash(); else if(view==='po')h=await poView(); else if(view==='grn')h=await grnView(); else if(view==='dn')h=await dnView();
    else if(view==='asset')h=await assetView(); else if(view==='bank')h=await bankView(); else if(view==='price')h=await priceView();
    else if(view==='hr')h=await hrView(); else if(view==='mfg')h=await mfgView(); else if(view==='pos')h=await posView(); else if(view==='proj')h=await projView(); else if(view==='period')h=await periodView();
    else if(view==='health')h=await healthView(); else if(view==='rep')h=await reportsView(); else if(view==='jr')h=await accountsView(); else if(view==='users')h=await usersView();
    else if(view==='appr')h=await approvalView(); else if(view==='chk')h=await chequeView(); else if(view==='comm')h=await commissionView(); else if(view==='taxdoc')h=await taxdocView(); else if(view==='int')h=await integrationsView(); else if(view==='org')h=await orgView(); else h=await legacyHtml();
    if(!h)h='<div class="card">صفحة غير متاحة.</div>';
  }catch(x){h=`<div class="card error-card"><b>تعذر تحميل الصفحة</b><p>${e(x.message||x)}</p></div>`}
  const links=NAV.filter(x=>can(x[0])).map(x=>`<a class="${view===x[0]?'on':''}" onclick="view='${x[0]}';R()"><span>${x[1]}</span></a>`).join('');
  $('#app').innerHTML=`<aside class="sidebar"><div class="brandbox"><div class="brandmark">E</div><div><b>ERP Enterprise</b><small>Finance · Inventory · Operations</small></div></div><div class="userbox"><div class="avatar">${e((me.name||'U').slice(0,1))}</div><div><b>${e(me.name)}</b><small>${e(me.role)}</small></div></div><nav>${links}</nav><div class="side-bottom"><button class="sidebtn" onclick="view='set';R()">الإعدادات</button><button class="sidebtn danger-link" onclick="logout()">تسجيل الخروج</button></div></aside><main class="shell"><header class="topbar"><div class="top-search"><span>⌕</span><input placeholder="بحث سريع في النظام" onkeydown="if(event.key==='Enter'){window._q=this.value;view='prod';R()}"/></div><div class="top-actions">${me.role==='admin'?'<button class="iconbtn" title="فحص الجاهزية" onclick="view=\'health\';R()">✓</button>':''}<button class="role-pill">${e(me.role)}</button></div></header><div class="page">${h}</div></main>`;
  if(q){const i=$('#q');if(i){i.focus();i.setSelectionRange(99,99)}}
}
function _loginScreen(){$('#app').innerHTML=`<main><div class="card" style="max-width:380px;margin:70px auto"><div class="brandbox" style="justify-content:center"><div class="brandmark">E</div><div><b>ERP Enterprise</b><small>منظومة إدارة الأعمال</small></div></div><h2>تسجيل الدخول</h2><input id="lu" type="email" placeholder="البريد الإلكتروني" style="width:100%;margin:4px 0"><input id="lp" type="password" placeholder="كلمة المرور" style="width:100%;margin:4px 0"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">دخول</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="signup()">إنشاء حساب</button></div></main>`}
function _inactiveScreen(){$('#app').innerHTML=`<main><div class="card" style="max-width:520px;margin:80px auto;text-align:center"><h2>الحساب بانتظار التفعيل</h2><p class="muted">سيتطلب الحساب تفعيل المدير قبل استخدام النظام.</p><button class="btn" onclick="logout()">خروج</button></div></main>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:v('lu'),password:v('lp')});if(error)return alert(error.message);await boot()}
async function signup(){const{error}=await sb.auth.signUp({email:v('lu'),password:v('lp')});if(error)return alert(error.message);alert('تم إنشاء الحساب. أكد البريد إذا كان التأكيد مفعلاً.')}
async function logout(){await sb.auth.signOut();me=null;R()}
async function boot(){const{data:{user}}=await sb.auth.getUser();me=null;if(user){const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(!error)me=data}R()}
sb.auth.getSession().then(boot);
</script>
</body></html>
